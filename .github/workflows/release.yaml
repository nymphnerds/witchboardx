name: Build and release WitchboardX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev zip unzip

      - name: Fetch verified disting NT API
        run: |
          git init ../distingNT_API
          git -C ../distingNT_API remote add origin https://github.com/expertsleepersltd/distingNT_API.git
          git -C ../distingNT_API fetch --depth 1 origin 5a4910d1d4233180114d6aee5ddaa4b8aec577e8
          git -C ../distingNT_API checkout --detach FETCH_HEAD

      - name: Show tool versions
        run: |
          c++ --version
          arm-none-eabi-c++ --version
          arm-none-eabi-nm --version
          arm-none-eabi-readelf --version

      - name: Test, build, inspect, and package Witchboard
        run: |
          make clean
          make package
          ls -la release
          sha256sum release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "WitchboardX ${GITHUB_REF_NAME}" \
              --latest \
              --draft=false \
              --prerelease=false \
              --notes-file .github/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              release/WitchboardX.o \
              release/WitchboardX.zip \
              release/release.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/WitchboardX.o \
              release/WitchboardX.zip \
              release/release.zip \
              --verify-tag \
              --title "WitchboardX ${GITHUB_REF_NAME}" \
              --latest \
              --draft=false \
              --prerelease=false \
              --notes-file .github/release-notes.md
          fi
