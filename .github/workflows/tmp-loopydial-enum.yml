name: Temporary Loopy Dial enum GNU ARM build

on:
  push:
    branches:
      - tmp-loopydial-full-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev

      - name: Fetch same verified disting NT API used by WitchboardX
        run: |
          git init ../distingNT_API
          git -C ../distingNT_API remote add origin https://github.com/expertsleepersltd/distingNT_API.git
          git -C ../distingNT_API fetch --depth 1 origin 5a4910d1d4233180114d6aee5ddaa4b8aec577e8
          git -C ../distingNT_API checkout --detach FETCH_HEAD

      - name: Build full Loopy Dial with native enum names
        run: |
          mkdir -p tmp-loopydial-enum/plugins
          arm-none-eabi-c++ \
            -std=c++11 \
            -mcpu=cortex-m7 \
            -mfpu=fpv5-d16 \
            -mfloat-abi=hard \
            -mthumb \
            -Os \
            -fPIC \
            -fno-rtti \
            -fno-exceptions \
            -Wall -Wextra -Werror \
            -I../distingNT_API/include \
            -c tmp-loopydial-enum/loopydial.cpp \
            -o tmp-loopydial-enum/plugins/loopydial.o

      - name: Inspect object
        run: |
          file tmp-loopydial-enum/plugins/loopydial.o
          arm-none-eabi-size -B tmp-loopydial-enum/plugins/loopydial.o
          echo '--- pluginEntry ---'
          arm-none-eabi-nm tmp-loopydial-enum/plugins/loopydial.o | grep ' pluginEntry$'
          echo '--- undefined symbols ---'
          arm-none-eabi-nm -u tmp-loopydial-enum/plugins/loopydial.o || true
          echo '--- attributes ---'
          arm-none-eabi-readelf -A tmp-loopydial-enum/plugins/loopydial.o

      - name: Upload object
        uses: actions/upload-artifact@v4
        with:
          name: loopydial-enum-gnu-arm
          path: tmp-loopydial-enum/plugins/loopydial.o
          if-no-files-found: error
